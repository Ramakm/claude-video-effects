<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:SG;src:url(../fonts/space-grotesk-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:SG;src:url(../fonts/space-grotesk-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:SM;src:url(../fonts/space-mono-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:SM;src:url(../fonts/space-mono-latin-700-normal.woff2);font-weight:700}
html,body{margin:0;padding:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="out"></canvas>
<span style="font-family:SG;font-weight:700;position:absolute;left:-999px">.</span><span style="font-family:SM;font-weight:700;position:absolute;left:-999px">.</span>
<script src="effects.js"></script>
<script>
// Driven by scripts/fx.py through Playwright: setup(job) once, then renderFrame(i) per frame.
let JOB, OUT, CTX, Fc, Cc, HIST = [], HN = 72, Hs = .5;

function loadImg(src) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('load ' + src)); im.src = src; }); }
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function darker(hex, f) { const n = parseInt(hex.slice(1), 16); const r = (n >> 16) * f | 0, g = ((n >> 8) & 255) * f | 0, b = (n & 255) * f | 0; return `rgb(${r},${g},${b})`; }

window.setup = async (job) => {
  JOB = job; OUT = document.getElementById('out'); OUT.width = job.W; OUT.height = job.H; CTX = OUT.getContext('2d');
  Fc = canvas(job.W, job.H); Cc = canvas(job.W, job.H); HIST = [];
  await document.fonts.load('700 20px SG'); await document.fonts.load('700 20px SM'); await document.fonts.ready;
  return Object.keys(EFFECTS);
};

async function loadFrame(i) {
  const pad = String(i + 1).padStart(5, '0');
  const [f, m] = await Promise.all([loadImg(JOB.dir + '/f' + pad + '.jpg'), loadImg(JOB.dir + '/m' + pad + '.png')]);
  const W = JOB.W, H = JOB.H;
  Fc.getContext('2d').drawImage(f, 0, 0, W, H);
  const cc = Cc.getContext('2d'); cc.globalCompositeOperation = 'source-over'; cc.clearRect(0, 0, W, H); cc.drawImage(f, 0, 0, W, H);
  cc.globalCompositeOperation = 'destination-in'; cc.imageSmoothingQuality = 'high'; cc.drawImage(m, 0, 0, W, H); cc.globalCompositeOperation = 'source-over';
  const hw = Math.round(W * Hs), hh = Math.round(H * Hs), hf = canvas(hw, hh), hc = canvas(hw, hh);
  hf.getContext('2d').drawImage(Fc, 0, 0, hw, hh); hc.getContext('2d').drawImage(Cc, 0, 0, hw, hh);
  HIST.push({ F: hf, C: hc }); if (HIST.length > HN) HIST.shift();
}

// i: frame index in the extracted folder. Frames before job.pre are history only.
window.renderFrame = async (i, draw = true) => {
  await loadFrame(i);
  if (!draw) return;
  const W = JOB.W, H = JOB.H, fi = i - JOB.pre, t = fi / JOB.fps, d = JOB.dur, p = clamp(t / d);
  const fade = Math.max(.001, Math.min(JOB.ramp, d / 2)), k = ss(0, fade, t) * (1 - ss(d - fade, d, t));
  const fc = JOB.faces[i] || JOB.faces[JOB.faces.length - 1];
  const S = { W, H, u: Math.min(W, H) / 100, F: Fc, C: Cc, t, p, d, k, o: JOB.opts || {},
    face: { x: fc[0] * W, y: fc[1] * H, r: fc[2] * H },
    hist: n => HIST[Math.max(0, HIST.length - 1 - n)] || HIST[0] };
  S.accent = S.o.color || '#FF8A1F'; S.accentDark = darker(S.accent, .72);
  CTX.save(); CTX.setTransform(1, 0, 0, 1, 0, 0); CTX.globalAlpha = 1; CTX.filter = 'none'; CTX.globalCompositeOperation = 'source-over';
  CTX.clearRect(0, 0, W, H); EFFECTS[JOB.fx](CTX, S); CTX.restore();
};
</script></body></html>
